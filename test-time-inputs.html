<!DOCTYPE html>
<html>
<head>
    <title>Test Time Inputs</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
    <div id="app" class="p-8">
        <h1 class="text-2xl font-bold mb-4">Test Time Inputs</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <!-- Check-in Time -->
            <div>
                <label for="checkin_time" class="block text-sm font-medium text-gray-700">Horário de Check-in</label>
                <input
                    id="checkin_time"
                    type="time"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
                    v-model="form.checkin_time"
                    required
                />
                <div class="text-red-500 text-sm mt-2" v-if="errors.checkin_time">{{ errors.checkin_time }}</div>
            </div>

            <!-- Check-out Time -->
            <div>
                <label for="checkout_time" class="block text-sm font-medium text-gray-700">Horário de Check-out</label>
                <input
                    id="checkout_time"
                    type="time"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
                    v-model="form.checkout_time"
                    required
                />
                <div class="text-red-500 text-sm mt-2" v-if="errors.checkout_time">{{ errors.checkout_time }}</div>
            </div>
        </div>
        
        <div class="mt-4">
            <p>Check-in: {{ form.checkin_time }}</p>
            <p>Check-out: {{ form.checkout_time }}</p>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        
        createApp({
            data() {
                return {
                    form: {
                        checkin_time: '14:00',
                        checkout_time: '11:00'
                    },
                    errors: {}
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
